<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Mariah Cesar — Dev estagiária, Engenharia da Computação, Física Espacial" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1f"/>
      <stop offset="0.6" stop-color="#17133d"/>
      <stop offset="1" stop-color="#2a1b5e"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="0.75" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0abfc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="earth" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#14123a"/>
      <stop offset="1" stop-color="#0b0a1f"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#sky)"/>

    <!-- aurora -->
    <path fill="url(#aur1)" d="M-200 150 C -50 90, 120 200, 280 140 S 560 80, 720 150 S 1000 120, 1100 150 L1100 260 L-200 260 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 8; 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#aur2)" d="M-200 185 C -20 140, 160 230, 330 175 S 600 130, 760 185 S 1000 160, 1100 185 L1100 260 L-200 260 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 -6; 0 0" dur="16s" repeatCount="indefinite"/>
    </path>

    <!-- estrelas -->
    <g fill="#ffffff">
      <circle cx="40" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="70" r="0.9"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="24" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="58" r="0.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="380" cy="20" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="75" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="35" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="590" cy="90" r="0.8"><animate attributeName="opacity" values="1;0.2;1" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="28" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="62" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="22" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="80" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="70" cy="140" r="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="190" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="140" r="0.9"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Terra e camadas da ionosfera -->
    <circle cx="730" cy="520" r="300" fill="url(#earth)"/>
    <circle cx="730" cy="520" r="300" fill="none" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="730" cy="520" r="320" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="730" cy="520" r="344" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>
    <circle cx="730" cy="520" r="372" fill="none" stroke="#f0abfc" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 6"/>

    <!-- satélite em órbita -->
    <path id="orbit" d="M 305 520 A 425 425 0 0 1 1155 520" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <circle r="3.5" fill="#fde68a">
      <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
    </circle>

    <!-- texto -->
    <text x="60" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="url(#title)">Mariah Cesar</text>
    <text x="62" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c4b5fd" letter-spacing="1.5">dev estagiária  ·  eng. da computação  ·  física espacial</text>
    <rect x="62" y="166" width="64" height="3" rx="1.5" fill="#5eead4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
